# CI for NvimManager: builds the solution, runs the unit tests, and
# publishes the Avalonia desktop app (framework-dependent win-x64).

name: .NET Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Install the .NET SDK (the projects target net10.0)
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Build the .slnx solution (dotnet CLI; MSBuild.exe cannot build .slnx)
    - name: Build
      run: dotnet build NvimManager.slnx -c ${{ matrix.configuration }}

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test NvimManager.slnx -c ${{ matrix.configuration }} --no-build

    # Publish the desktop app (Release only)
    - name: Publish app
      if: matrix.configuration == 'Release'
      run: dotnet publish src/NvimManager.App/NvimManager.App.csproj -c Release --no-build -o publish/app

    # Upload the published app: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload app artifact
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: NvimManager-win-x64
        path: publish/app
