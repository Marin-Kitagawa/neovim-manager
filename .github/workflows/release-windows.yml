# Windows release. Triggered by a version tag (e.g. v0.1.0).
# Deliberately separate from release-linux.yml / release-macos.yml so a
# failure on one platform never blocks the release assets of another.
#
# Cut a release with:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release (Windows)

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  RID: win-x64

jobs:

  release:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Install the .NET SDK (the projects target net10.0)
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build NvimManager.slnx -c Release

    - name: Execute unit tests
      run: dotnet test NvimManager.slnx -c Release --no-build

    - name: Publish app
      run: dotnet publish src/NvimManager.App/NvimManager.App.csproj -c Release -r ${{ env.RID }} --self-contained false -o publish/app

    - name: Zip app
      run: Compress-Archive -Path publish/app/* -DestinationPath NvimManager-${{ env.RID }}.zip

    - name: Ensure release exists
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        for i in 1 2 3 4 5; do
          if gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
            --title "NvimManager ${{ github.ref_name }}" --generate-notes > /dev/null 2>&1 && exit 0
          echo "Release creation raced with another platform workflow, retrying..."
          sleep 15
        done
        # Final check: another workflow may have created it in the meantime.
        gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1

    - name: Upload release asset
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        for i in 1 2 3; do
          gh release upload "${{ github.ref_name }}" "NvimManager-${{ env.RID }}.zip" --repo "$GITHUB_REPOSITORY" --clobber && exit 0
          sleep 10
        done
        exit 1
