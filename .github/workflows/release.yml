# Creates a GitHub Release with the published app whenever a version tag
# (e.g. v0.1.0) is pushed. CI run artifacts live on the workflow run page
# and expire; only tagged builds appear under Releases.
#
# Cut a release with:
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:

  release:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Install the .NET SDK (the projects target net10.0)
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build NvimManager.slnx -c Release

    - name: Execute unit tests
      run: dotnet test NvimManager.slnx -c Release --no-build

    - name: Publish app
      run: dotnet publish src/NvimManager.App/NvimManager.App.csproj -c Release --no-build -o publish/app

    - name: Zip app
      run: Compress-Archive -Path publish/app/* -DestinationPath NvimManager-win-x64.zip

    # Create the GitHub Release and attach the zip (release notes generated
    # from merged pull requests automatically)
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: NvimManager-win-x64.zip
        generate_release_notes: true
